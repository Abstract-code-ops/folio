version: "3.9"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - /workspace/web/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    command: sleep infinity

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
      - "11434:11434"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OLLAMA_API_BASE=http://localhost:11434
      - OPENAI_MAX_RETRIES=0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OLLAMA_API_BASE=http://localhost:11434
      - OPENAI_MAX_RETRIES=0
    command: dramatiq app.workers
